<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Chat - SocialHub</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/chat.css}">
</head>

<body>
    <nav th:replace="~{fragments/nav :: navbar}"></nav>
    <div class="chat-container">
        <div class="conversation-list">
            <a href="/chat/new" class="btn btn-primary mb-3">New Chat</a>
            <h3>Conversations</h3>
            <div th:each="conv : ${conversations}" class="conv-item" th:attr="data-conv-id=${conv.id}">
                <span th:text="${conv.type == 'PRIVATE' ? 'Private' : conv.name}"></span>
            </div>
        </div>
        <div class="message-area">
            <div class="messages" id="messages" th:attr="data-current-conv-id=${currentConversationId}"></div>
            <form id="messageForm">
                <input type="hidden" id="conversationId" name="conversationId" value="">
                <input type="text" id="messageContent" placeholder="Type a message..." required>
                <button type="submit" class="btn">Send</button>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script th:src="@{/js/chat.js}"></script>
</body>

</html>
