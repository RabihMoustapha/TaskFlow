<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed - SocialHub</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <nav th:replace="~{fragments/nav :: navbar}"></nav>
    <div class="container">
        <div class="card">
            <h3>Share something</h3>
            <form th:action="@{/posts}" th:object="${newPost}" method="post">
                <textarea th:field="*{content}" rows="3" maxlength="280" placeholder="What's on your mind?"
                    required></textarea>
                <p th:if="${#fields.hasErrors('content')}" class="error" th:errors="*{content}"></p>
                <button type="submit" class="btn">Post</button>
            </form>
        </div>
        <h3>Recent Posts</h3>
        <div th:if="${#lists.isEmpty(posts)}" class="card">
            <p>No posts yet. Be the first to share!</p>
        </div>
        <div class="post" th:each="post : ${posts}">
            <div class="post-header">
                <span class="post-author" th:text="${post.author.username}"></span>
                <span class="post-date" th:text="${post.formattedCreatedAt}"></span>
            </div>
            <p class="post-content" th:text="${post.content}"></p>
        </div>
    </div>
</body>

</html>
