<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Calls - SocialHub</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/calls.css}">
</head>
<body>
    <nav th:replace="~{fragments/nav :: navbar}"></nav>
    <div class="container">
        <h2>Call History</h2>
        <div th:each="call : ${callHistory}" class="call-item">
            <span th:text="${call.caller.username} + ' → ' + ${call.callee.username}"></span>
            <span th:text="${call.status}"></span>
            <span th:text="${call.startedAt}"></span>
        </div>
    </div>
    <!-- Add user list to start a call -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script>
        // Connect and subscribe to /user/queue/calls for incoming calls
    </script>
</body>
</html>
