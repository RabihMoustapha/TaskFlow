<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SocialHub</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <div class="card auth-card">
            <h2>Create Account</h2>
            <p th:if="${error}" class="error" th:text="${error}"></p>
            <form th:action="@{/register}" th:object="${user}" method="post">
                <div>
                    <label for="username">Username</label>
                    <input type="text" id="username" th:field="*{username}" placeholder="Choose a username" required>
                    <p th:if="${#fields.hasErrors('username')}" class="error" th:errors="*{username}"></p>
                </div>
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}" placeholder="you@example.com" required>
                    <p th:if="${#fields.hasErrors('email')}" class="error" th:errors="*{email}"></p>
                </div>
                <div>
                    <label for="password">Password</label>
                    <input type="password" id="password" th:field="*{password}" placeholder="Minimum 6 characters" required>
                    <p th:if="${#fields.hasErrors('password')}" class="error" th:errors="*{password}"></p>
                </div>
                <button type="submit" class="btn">Register</button>
            </form>
            <p class="auth-link">Already have an account? <a th:href="@{/login}">Login</a></p>
        </div>
    </div>
</body>
</html>
